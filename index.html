<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>ng-swiper-element Storybook</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #202124;
        background: #f7f8fa;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        place-items: center;
      }

      main {
        width: min(28rem, calc(100% - 3rem));
        padding: 2rem;
        border: 1px solid #e1e4e8;
        border-radius: 0.75rem;
        background: white;
        box-shadow: 0 0.5rem 1.5rem rgb(32 33 36 / 8%);
      }

      h1 {
        margin-top: 0;
        font-size: 1.5rem;
      }

      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 600;
      }

      select {
        width: 100%;
        padding: 0.75rem;
        border: 1px solid #aeb4bc;
        border-radius: 0.375rem;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>ng-swiper-element Storybook</h1>
      <label for="version">Angular version</label>
      <select id="version" onchange="location.href = './v' + this.value + '/'">
        <option value="21" selected>Angular 21</option>
        <option value="20">Angular 20</option>
        <option value="19">Angular 19</option>
        <option value="18">Angular 18</option>
        <option value="17">Angular 17</option>
      </select>
    </main>
  </body>
</html>
