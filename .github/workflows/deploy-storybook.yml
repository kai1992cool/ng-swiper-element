name: Deploy Storybook to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      angular-major-versions:
        description: Angular major versions to deploy, comma-separated. Leave blank for all versions.
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  select-versions:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select Angular and Node.js versions
        id: select
        env:
          ANGULAR_MAJOR_VERSIONS: ${{ github.event.inputs.angular-major-versions }}
        shell: python
        run: |
          import json
          import os

          versions_by_angular = {
              '17': {'angular-version': 17, 'node-version': '20.19.0'},
              '16': {'angular-version': 16, 'node-version': '18.20.8'},
              '15': {'angular-version': 15, 'node-version': '18.20.8'},
              '14': {'angular-version': 14, 'node-version': '16.20.2'},
          }

          raw = os.environ.get('ANGULAR_MAJOR_VERSIONS', '').strip()
          versions = (
              [item.strip() for item in raw.split(',') if item.strip()]
              if raw
              else list(versions_by_angular)
          )
          if not versions:
              raise SystemExit('Select at least one Angular version.')

          invalid = [item for item in versions if item not in versions_by_angular]

          if invalid:
              raise SystemExit(
                  f"Invalid angular-major-versions value(s): {', '.join(invalid)}. Allowed values are 14,15,16,17 or blank."
              )

          selected_versions = list(dict.fromkeys(versions))
          matrix = {
              'include': [versions_by_angular[version] for version in selected_versions]
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"matrix={json.dumps(matrix, separators=(',', ':'))}\n")

  deploy:
    needs: select-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJson(needs.select-versions.outputs.matrix) }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Apply Angular version dependencies
        run: node scripts/use-angular-version.mjs ${{ matrix.angular-version }}

      - name: Install dependencies (Old angular packages have peer dependency issues, so using --legacy-peer-deps)
        run: npm install --no-package-lock --legacy-peer-deps

      - name: Build Angular library
        run: npx ng build ng-swiper-element

      - name: Build Storybook
        run: npm run build-storybook

      - name: Deploy this version to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./storybook-static
          publish_branch: gh-pages
          destination_dir: v${{ matrix.angular-version }}
          keep_files: true