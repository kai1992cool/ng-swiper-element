name: Deploy Storybook to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      angular-major-versions:
        description: Angular major versions to deploy, comma-separated. Leave blank for all versions.
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        angular-version: ${{ fromJson(github.event.inputs.angular-major-versions == '' && '[10,11,12,13]' || format('[{0}]', join(github.event.inputs.angular-major-versions, ','))) }}
    steps:
      - name: Validate Angular version
        env:
          ANGULAR_VERSION: ${{ matrix.angular-version }}
        shell: python
        run: |
          import os

          version = os.environ['ANGULAR_VERSION']
          if version not in {'10', '11', '12', '13'}:
              raise SystemExit(
                  f"Invalid Angular version: {version}. Allowed values are 10,11,12,13."
              )

      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.angular-version == 13 && '12.20.0' || (matrix.angular-version == 12 && '12.14.0' || (matrix.angular-version == 11 && '10.13.0' || '10.13.0')) }}
          cache: npm

      - name: Apply Angular version dependencies
        run: node scripts/use-angular-version.mjs ${{ matrix.angular-version }}

      - name: Install dependencies (Old angular packages have peer dependency issues, so using --legacy-peer-deps)
        run: npm install --no-package-lock --legacy-peer-deps

      - name: Build Angular library
        run: npx ng build ng-swiper-element

      - name: Build Storybook
        run: npm run build-storybook

      - name: Deploy this version to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./storybook-static
          publish_branch: gh-pages
          destination_dir: v${{ matrix.angular-version }}
          keep_files: true