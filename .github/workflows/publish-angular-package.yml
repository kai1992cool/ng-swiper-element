name: Publish Angular Package

on:
  workflow_dispatch:
    inputs:
      angular-major-versions:
        description: Angular major versions to publish, comma-separated. Leave blank for all versions.
        required: false
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    environment: DEV
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        angular-version: ${{ fromJson(github.event.inputs.angular-major-versions == '' && '[14,15,16,17]' || format('[{0}]', join(github.event.inputs.angular-major-versions, ','))) }}
    steps:
      - name: Validate Angular version
        env:
          ANGULAR_VERSION: ${{ matrix.angular-version }}
        shell: python
        run: |
          import os

          version = os.environ['ANGULAR_VERSION']
          if version not in {'14', '15', '16', '17'}:
              raise SystemExit(
                  f"Invalid Angular version: {version}. Allowed values are 14,15,16,17."
              )

      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.angular-version == 17 && '20.19.0' || (matrix.angular-version == 16 && '18.20.8' || (matrix.angular-version == 15 && '18.20.8' || '18.20.8')) }}
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Apply Angular version dependencies
        run: node scripts/use-angular-version.mjs ${{ matrix.angular-version }}

      - name: Install dependencies (Old angular packages have peer dependency issues, so using --legacy-peer-deps)
        run: npm install --no-package-lock --legacy-peer-deps

      - name: Build Angular package
        run: npm run publish-package ${{ matrix.angular-version }}

      - name: Setup latest Node.js for publishing
        uses: actions/setup-node@v4
        with:
          node-version: latest
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm to latest
        run: npm install --global npm@latest

      - name: Publish Angular package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm stage publish --tag angular-${{ matrix.angular-version }} --provenance --access public
        working-directory: dist/ng-swiper-element
