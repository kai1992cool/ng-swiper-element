<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#ffffff">
    <title>ng-swiper-element Storybook</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, sans-serif;
        color: #202124;
        background: #f7f8fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: flex;
        flex-direction: column;
        height: 100vh;
        height: 100dvh;
        min-height: 24rem;
        margin: 0;
      }

      header {
        display: flex;
        min-height: 4rem;
        align-items: center;
        justify-content: space-between;
        gap: 1rem;
        padding: 0 1.5rem;
        border-bottom: 1px solid #e1e4e8;
        background: #fff;
      }

      .brand {
        color: inherit;
        font-size: 1.1rem;
        font-weight: 700;
        text-decoration: none;
        white-space: nowrap;
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 1.25rem;
      }

      .resource-link {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        color: #3b3f46;
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        white-space: nowrap;
      }

      .resource-link:hover,
      .resource-link:focus-visible {
        color: #0969da;
      }

      .resource-link svg {
        width: 1.15rem;
        height: 1.15rem;
        fill: currentColor;
      }

      .version-control {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        color: #3b3f46;
        font-size: 0.9rem;
        font-weight: 600;
        white-space: nowrap;
      }

      select {
        min-height: 2.25rem;
        padding: 0.35rem 2rem 0.35rem 0.65rem;
        border: 1px solid #c7cbd1;
        border-radius: 0.375rem;
        background: #fff;
        color: inherit;
        font: inherit;
      }

      main {
        flex: 1;
        min-height: 0;
      }

      iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }

      #status {
        position: absolute;
        z-index: 1;
        top: 4rem;
        right: 1rem;
        margin: 0;
        padding: 0.5rem 0.75rem;
        border: 1px solid #e1e4e8;
        border-radius: 0.375rem;
        background: #fff;
        font-size: 0.85rem;
      }

      #status[hidden] {
        display: none;
      }

      @media (max-width: 600px) {
        header {
          min-height: 4.5rem;
          gap: 0.75rem;
          padding: 0 0.75rem;
        }

        .brand {
          font-size: 0.95rem;
        }

        .actions {
          gap: 0.65rem;
        }

        .resource-link {
          font-size: 0;
        }

        .resource-link svg {
          width: 1.3rem;
          height: 1.3rem;
        }

        .version-control {
          gap: 0.3rem;
          font-size: 0.8rem;
        }

        select {
          max-width: 6.5rem;
          padding-right: 1.25rem;
          font-size: 0.8rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="./">ng-swiper-element</a>
      <nav class="actions" aria-label="Project links and Storybook version">
        <a
          class="resource-link"
          href="https://github.com/kai1992cool/ng-swiper-element"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="GitHub repository"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 .9a11.1 11.1 0 0 0-3.51 21.63c.55.1.76-.24.76-.54v-2.08c-3.1.68-3.75-1.32-3.75-1.32-.5-1.28-1.23-1.62-1.23-1.62-1.01-.69.08-.68.08-.68 1.12.08 1.7 1.15 1.7 1.15.99 1.7 2.59 1.2 3.22.92.1-.72.39-1.2.7-1.48-2.48-.28-5.09-1.24-5.09-5.52 0-1.22.44-2.22 1.15-3-.12-.28-.5-1.42.1-2.96 0 0 .94-.3 3.05 1.15a10.6 10.6 0 0 1 5.55 0c2.12-1.44 3.05-1.15 3.05-1.15.61 1.54.23 2.68.11 2.96.72.78 1.15 1.78 1.15 3 0 4.29-2.61 5.23-5.1 5.51.4.35.75 1.02.75 2.06v3.06c0 .3.2.65.77.54A11.1 11.1 0 0 0 12 .9Z"/>
          </svg>
          GitHub
        </a>
        <a
          class="resource-link"
          href="https://www.npmjs.com/package/ng-swiper-element"
          target="_blank"
          rel="noopener noreferrer"
          aria-label="ng-swiper-element on npm"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M1.5 7.5h21v9h-10.5v1.5h-5.25V16.5H1.5v-9Zm3 1.5v6h3v-4.5h1.5V15h3V9h-7.5Zm9 0v6h3v-4.5H18V15h3V9h-7.5Z"/>
          </svg>
          npm
        </a>
        <label class="version-control" for="version">
          <span>Angular</span>
          <select id="version" aria-label="Angular version">
            <option value="22">22</option>
            <option value="21">21</option>
            <option value="20">20</option>
            <option value="19" selected>19</option>
            <option value="18">18</option>
            <option value="17">17</option>
          </select>
        </label>
      </nav>
    </header>
    <p id="status" role="status" aria-live="polite" hidden></p>
    <main>
      <iframe id="storybook" src="./v19/" title="ng-swiper-element Storybook for Angular 19"></iframe>
    </main>
    <script>
      const versionSelect = document.getElementById('version');
      const storybookFrame = document.getElementById('storybook');
      const status = document.getElementById('status');

      function showVersion(version) {
        storybookFrame.src = `./v${version}/`;
        storybookFrame.title = `ng-swiper-element Storybook for Angular ${version}`;
      }

      versionSelect.addEventListener('change', () => showVersion(versionSelect.value));

      async function selectNewestPublishedVersion() {
        let couldNotCheckVersion = false;
        const checks = await Promise.all(
          [...versionSelect.options].map(async (option) => {
            try {
              const response = await fetch(`./v${option.value}/index.html`, {
                method: 'HEAD',
                cache: 'no-store',
              });
              return { option, published: response.ok };
            } catch (error) {
              console.error(`Could not check Angular ${option.value} Storybook availability.`, error);
              couldNotCheckVersion = true;
              return { option, published: null };
            }
          }),
        );
        const published = checks.filter((check) => check.published === true);

        checks
          .filter((check) => check.published === false)
          .forEach((check) => check.option.remove());

        if (published.length > 0) {
          const newest = published[0].option;
          versionSelect.value = newest.value;
          showVersion(newest.value);
        } else if (couldNotCheckVersion) {
          status.textContent = 'Could not check all published Storybook versions. You can still choose a version above.';
          status.hidden = false;
        } else {
          status.textContent = 'No Angular Storybook versions have been deployed yet.';
          status.hidden = false;
        }
      }

      selectNewestPublishedVersion();
    </script>
  </body>
</html>
